# Disposition ledger for this deployment ($TRAUST_CONFIG_HOME/ledger.yaml).
# Optional: without this file, *-findings-layer.json files are the ledger.
# Copy it only when you need a setting below; every key is optional, but the
# file must set at least one. No environment variable overrides any of it.
#
# Never put secrets here. The keypair password (COSIGN_PASSWORD), an ambient
# keyless signing token and your ledger token (`ledger auth login`) stay with
# the runner. Schema: contracts config/v1/ledger.schema.json (through traust-core).

# Ledger database. Set: the database is the authority, layer files become
# read-only snapshots, and every ledger CLI needs --ledger-layer or
# --product-repo. Usually the storage database under the ledger's own role.
dsn: postgresql+psycopg://ledger_rw@db.example.internal/traust

# How layer Merkle roots are signed (both modes).
signing:
  required: true
  method: keypair              # keypair | identity (keyless Sigstore/OIDC)
  key_path: /run/secrets/traust/cosign.key
  # identity only (unset = Sigstore defaults):
  # oidc_issuer: https://oauth2.sigstore.dev/auth
  # oidc_client_id: sigstore
  # expected_identity: harness@example.com
  # ca_url: https://fulcio.example.com
  # tlog_url: https://rekor.example.com

# How the caller's ledger token is verified (both modes). Omit for local tokens.
# identity:
#   oidc_issuer: https://issuer.example.com
#   oidc_audience: laas-api
#   jwks_url: https://issuer.example.com/keys      # default: discovered from oidc_issuer
#   directory_command: /usr/local/bin/ledger-directory
